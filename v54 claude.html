        :root {
            --phosphor-main: #33FF00;
            --phosphor-dim: #1a8000;
            --bg-color: #000000;
            --alert-color: #FFB000; 
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            color: var(--phosphor-main);
            font-family: 'IBM Plex Mono', 'VT323', 'Courier New', monospace;
            overflow: hidden;
            font-size: 22px;
            font-weight: 600;
        }

        #outer-frame {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        #crt-container {
            width: 95vw;
            height: 92vh;
            position: relative;
            border: 3px solid var(--phosphor-main);
            box-shadow: 
                0 0 20px rgba(51, 255, 0, 0.3),
                inset 0 0 50px rgba(51, 255, 0, 0.1);
            filter: contrast(1.1) brightness(1.05);
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        #scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(51, 255, 0, 0.1) 50%,
                transparent 100%
            );
            background-size: 100% 10px;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 11;
            opacity: 0.5;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        #narrative-window {
            height: 75%;
            padding: 30px;
            overflow-y: auto;
            overflow-x: hidden;
            border-bottom: 2px solid var(--phosphor-dim);
        }

        #terminal-window {
            height: 25%;
            background-color: #080808;
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .history-text {
            color: var(--phosphor-dim) !important;
            margin-bottom: 0.5em;
            display: block;
        }

        .current-text {
            color: var(--phosphor-main) !important;
            margin-bottom: 0.5em;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .dialogue {
            margin-left: 15%;
            margin-top: 1.5em;
            margin-bottom: 1.5em;
            text-align: justify;
            font-weight: 100;
            font-style: italic;
            line-height: 1.6;
            color: var(--phosphor-main) !important;
        }

        .dialogue-speaker {
            display: inline;
            font-weight: 100;
            margin-right: 0.5em;
            color: var(--phosphor-main) !important;
        }

        .dialogue-text {
            display: inline;
            color: var(--phosphor-main) !important;
        }

        .history-text .dialogue,
        .history-text .dialogue-speaker,
        .history-text .dialogue-text {
            color: var(--phosphor-dim) !important;
        }

        #input-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .prompt-char {
            margin-right: 15px;
            font-weight: bold;
            font-size: 24px;
            color: var(--phosphor-main);
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: transparent;
            font-family: inherit;
            font-size: 20px;
            flex-grow: 1;
            outline: none;
            caret-color: transparent;
            text-transform: uppercase;
            position: absolute;
            left: -9999px;
        }

        #display-text {
            color: var(--phosphor-main);
            font-size: 20px;
            position: relative;
        }

        .cursor-block {
            display: inline-block;
            width: 12px;
            height: 22px;
            background-color: var(--phosphor-main);
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            vertical-align: middle;
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }

        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid var(--phosphor-dim); }
        ::-webkit-scrollbar-thumb { background: var(--phosphor-dim); }
        ::-webkit-scrollbar-thumb:hover { background: var(--phosphor-main); }

        #timer-display {
            position: fixed;
            bottom: 25px;
            right: 40px;
            font-size: 40px;
            color: var(--alert-color);
            display: none;
            z-index: 5;
        }

            background-color: white;
            border: 2px solid black;
            padding: 20px;
            max-height: 65vh;
            overflow-y: auto;
            scroll-behavior: auto;
        }

            color: black !important;
        }

        .survey-frame .current-text * {
            color: black !important;
        }

            background-color: white;
            color: black;
            padding: 20px;
            margin: 10px 0;
            border: 2px solid black;
            line-height: 1.6;
        }

        .organization-table {
            width: 100%;
            border-collapse: collapse;
        }

        .organization-table td {
            width: 33%;
            padding: 10px;
            vertical-align: top;
        }
        
        .survey-history {
            background-color: white;
            padding: 20px;
            border: 2px solid black;
        }
        
        .survey-history * {
            color: #555;
        }

        .styled-table {
            background-color: black;
            color: var(--phosphor-main);
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            line-height: 1.8;
        }
        .styled-table td {
            width: 50%;
            border: 2px solid var(--phosphor-main);
            padding: 20px;
            vertical-align: top;
        }
        .styled-table h3 {
            color: var(--phosphor-main);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .styled-table .detail-section {
            margin-bottom: 25px;
        }

            margin-bottom: 0;
        }
        .styled-table b {
            color: var(--phosphor-main);
            display: block;
            margin-bottom: 8px;
        }
        .styled-table p {
            color: var(--phosphor-main);
            margin: 0 0 8px 0;
        }

        .leader-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

            width: 33.33%;
            padding: 0;
            vertical-align: top;
        }

            border: 2px solid var(--phosphor-main);

            background-color: var(--phosphor-main);
            color: #000000;
            padding: 10px;
            font-weight: bold;
            font-size: 16px;

            color: var(--phosphor-main);
            padding: 10px;
            line-height: 1.4;
            min-height: 120px;
            font-size: 14px;

</head>

function generateFullDetailsTable() {
    let tableHtml = '<table class="styled-table">';
    const orgIds = Object.keys(organizationDetails);
    
    for (let i = 0; i < orgIds.length; i += 2) {
        tableHtml += '<tr>';
        for (let j = i; j < i + 2 && j < orgIds.length; j++) {
            const orgId = orgIds[j];
            const org = organizationDetails[orgId];
            tableHtml += '<td><h3>' + orgId + '. ' + org.name + '</h3>';
            org.details.forEach(detail => {
                tableHtml += '<div class="detail-section">';
                const parts = detail.split(':');
                if (parts.length > 1) {
                    tableHtml += '<b>' + parts[0] + ':</b>';
                    tableHtml += '<p>' + parts.slice(1).join(':').trim() + '</p>';
                } else {
                    tableHtml += '<p>' + detail + '</p>';
                }
                tableHtml += '</div>';
            });
            tableHtml += '</td>';
        }
        if ((i + 1) < orgIds.length && (i + 1) % 2 !== 0) {
            tableHtml += '<td></td>';
        }
        tableHtml += '</tr>';
    }
    tableHtml += '</table>';
    return tableHtml;
}

dom.narrative.addEventListener('scroll', () => {
    userScrolling = true;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
        userScrolling = false;
    }, 2000);
});

function autoScroll(container, element) {
    if (userScrolling) return;
    if (!container || !element) return;
    
    try {
        const containerTop = container.scrollTop;
        const containerHeight = container.clientHeight;
        const elementTop = element.offsetTop;
        
        const targetScroll = elementTop - (containerHeight / 4);
        
        container.scrollTop = Math.max(0, targetScroll);
    } catch(e) {
        console.error('Scroll error:', e);
    }
}

async function printText(lines, speed = TYPE_SPEED, container = dom.narrative) {
    const myPrintId = ++currentPrintId;
    skipThisPrint = false;
    
    try {
        dom.input.disabled = true;
        const cursor = document.querySelector('.cursor-block');
        if (cursor) cursor.style.opacity = '0';
        
        const old = container.innerHTML;
        if (old) container.innerHTML = '<span class="history-text">' + old.replace(/class="current-text"/g, '') + '</span>';
        
        const block = document.createElement('div');
        block.className = 'current-text';
        container.appendChild(block);

        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            if (myPrintId !== currentPrintId) return;
            
            const line = lines[lineIndex];
            
            if (!line) { 
                block.appendChild(document.createElement('br'));
                continue; 
            }
            
            const currentNode = gameData[state.node];
            
            if (currentNode && currentNode.isHtml) {
                const div = document.createElement('div');
                div.innerHTML = line;
                block.appendChild(div);
                autoScroll(container, div);
                await new Promise(r => setTimeout(r, 50));
                
            } else if (typeof line === 'object' && line.leaderList) {
                const div = document.createElement('div');
                div.innerHTML = generateLeaderList();
                block.appendChild(div);
                autoScroll(container, div);
                await new Promise(r => setTimeout(r, 50));
                
            } else if (typeof line === 'object' && line.definition) {
                const div = document.createElement('div');
                div.className = 'survey-definition';
                div.textContent = line.text;
                block.appendChild(div);
                autoScroll(container, div);
                await new Promise(r => setTimeout(r, 50));
                
            } else if (typeof line === 'object' && line.dialogue) {
                const dialogueDiv = document.createElement('div');
                dialogueDiv.className = 'dialogue';
                block.appendChild(dialogueDiv);
                
                const speakerSpan = document.createElement('span');
                speakerSpan.className = 'dialogue-speaker';
                speakerSpan.textContent = line.speaker + ':';
                dialogueDiv.appendChild(speakerSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'dialogue-text';
                dialogueDiv.appendChild(textSpan);
                
                autoScroll(container, dialogueDiv);
                await new Promise(r => setTimeout(r, 100));
                
                for (let i = 0; i < line.text.length; i++) {
                    if (myPrintId !== currentPrintId) return;
                    if (skipThisPrint) {
                        textSpan.textContent = line.text;
                        autoScroll(container, dialogueDiv);
                        break;
                    }
                    
                    textSpan.textContent += line.text[i];
                    autoScroll(container, dialogueDiv);
                    await new Promise(r => setTimeout(r, speed));
                }
                await new Promise(r => setTimeout(r, speed * 3));
                
            } else {
                const p = document.createElement('div');
                block.appendChild(p);
                
                for (let i = 0; i < line.length; i++) {
                    if (myPrintId !== currentPrintId) return;
                    if (skipThisPrint) {
                        p.textContent = line;
                        autoScroll(container, p);
                        break;
                    }
                    
                    p.textContent += line[i];
                    autoScroll(container, p);
                    await new Promise(r => setTimeout(r, speed));
                }
                await new Promise(r => setTimeout(r, speed * 2));
            }
        }

        skipThisPrint = false;
        dom.input.disabled = false;
        dom.input.focus();
        if (cursor) cursor.style.opacity = '1';
        
    } catch (error) {
        console.error('Error in printText:', error);
        dom.input.disabled = false;
        const cursor = document.querySelector('.cursor-block');
        if (cursor) cursor.style.opacity = '1';
    }
}

async function runNode(id) {
    try {
        console.log('Running node:', id);
        state.node = id;
        state.errors = 0;
        const node = gameData[id];

        if (!node) {
            console.error("Missing node:", id);
            return; 
        }

        if (node.type === 'first_choice') {
            state.data.firstChoice = node.target;
            state.path.push('FIRST_CHOICE: ' + node.target);
            await runNode(node.next);
            return;
        }
        
        if (node.type === 'video_link') {
            const videoUrl = videoLinks[state.data.firstChoice];
            if (videoUrl) {
                state.data.videoStartTime = Date.now();
                window.open(videoUrl, '_blank');
                await printText([
                    "Projekcja została otwarta w nowej karcie.",
                    "",
                    "Jeśli obejrzałeś/obejrzałaś projekcję wprowadź komendę: \"OBEJRZAŁEM PROJEKCJĘ\" lub \"OBEJRZAŁAM PROJEKCJĘ\"."
                ]);
            } else {
                await printText(["Błąd systemu: nie znaleziono wideo. Naciśnij ENTER, aby kontynuować."]);
            }
            state.node = id; 
            return;
        }

        if (node.type === 'final_choice') {
            if (state.data.docsOpenTime && !state.data.docsToDecisionTime) {
                state.data.docsToDecisionTime = Math.floor((Date.now() - state.data.docsOpenTime) / 1000);
            }
            
            state.path.push(node.target);
            
            if (state.data.firstChoice !== node.target) {
                state.data.changedDecision = true;
            }
            
            state.data.finalChoice = node.target;
            await printText(['Potwierdzono ostateczny wybór: ' + node.target + '.']);
            await new Promise(r => setTimeout(r, 1000));
            await runNode(node.next);
            return;
        }

        if (node.type === 'final_choice_keep') {
            if (state.data.docsOpenTime && !state.data.docsToDecisionTime) {
                state.data.docsToDecisionTime = Math.floor((Date.now() - state.data.docsOpenTime) / 1000);
            }
            
            state.data.finalChoice = state.data.firstChoice;
            state.data.changedDecision = false;
            state.path.push('KEPT_FIRST: ' + state.data.firstChoice);
            await printText(['Podajesz kopertę z pierwszym wyborem: ' + state.data.firstChoice + '.']);
            await new Promise(r => setTimeout(r, 1000));
            await runNode(node.next);
            return;
        }

        if (node.next && node.type === 'narrative') {
            await printText(node.text);
            if (node.autoDelay) await new Promise(r => setTimeout(r, node.autoDelay));
            await runNode(node.next);
            return;
        }

        if (node.type === 'end') {
            await printText(node.text);
            saveData();
            return;
        }

        if (node.type.startsWith('survey')) {
            if (!document.querySelector('.survey-frame')) {
                const surveyFrame = document.createElement('div');
                surveyFrame.className = 'survey-frame';
                dom.narrative.appendChild(surveyFrame);
            }
            document.body.classList.add('survey-mode');
            
            const surveyFrame = document.querySelector('.survey-frame');
            await printText(node.text, 10, surveyFrame);
            
            setTimeout(() => {
                if (surveyFrame) {
                    surveyFrame.scrollTop = surveyFrame.scrollHeight;
                }
                dom.input.focus();
            }, 50);
            
            dom.timer.style.display = 'block';
            let displayTime = 30;
            let realTime = 45;
            dom.timer.textContent = "00:30";
            
            window.surveyInterval = setInterval(() => {
                realTime--;
                if (displayTime > 0) displayTime--;
                
                dom.timer.textContent = '00:' + (displayTime < 10 ? '0' + displayTime : displayTime);
                
                if (realTime <= 0) {
                    clearInterval(window.surveyInterval);
                    handleInput("[BRAK_CZASU]");
                }
            }, 1000);
            return;
        }

        await printText(node.text);
    } catch (error) {
        console.error('Error in runNode:', error);
    }
}

async function navigateToStage(index) {
    if (index >= 0 && index < stageList.length) {
        currentStageIndex = index;
        const stage = stageList[index];
        await printText(['Przechodzę do etapu ' + (index + 1) + ': ' + stage.name]);
        setTimeout(async () => {
            await runNode(stage.id);
        }, 500);
    }
}

async function handleInput(val) {
    try {
        const node = gameData[state.node];
        state.path.push(val);

        const lower = val.toLowerCase();
        
        if (lower === 'clear') { dom.narrative.innerHTML = ''; return; }
        if (lower === 'whoami') { await printText(['Badany: ' + (state.data.userName || 'NIEZNANY')]); return; }
        
        if (lower === 'ls') {
            window.stageNavigationActive = true;
            let output = ['=== LISTA ETAPÓW FORMULARZA ===', ''];
            stageList.forEach((stage, idx) => {
                output.push((idx + 1) + '. ' + stage.name);
            });
            output.push('');
            output.push('Użyj: cd[numer] aby przejść do etapu (np. cd5)');
            output.push('Lub użyj strzałek ↑↓ aby nawigować po etapach');
            await printText(output);
            return;
        }
        
        if (lower.startsWith('cd')) {
            const stageNum = parseInt(lower.substring(2));
            if (!isNaN(stageNum) && stageNum >= 1 && stageNum <= stageList.length) {
                navigateToStage(stageNum - 1);
            } else {
                await printText(['Nieprawidłowy numer etapu. Użyj: ls aby zobaczyć listę.']);
            }
            return;
        }

        if (node.type === 'video_link') {
            if (lower.includes('obejrzałem') || lower.includes('obejrzalem') || lower.includes('obejrzałam') || lower.includes('obejrzalam')) {
                if (state.data.videoStartTime) {
                    const watchTime = Math.floor((Date.now() - state.data.videoStartTime) / 1000);
                    state.data.videoWatchTime = watchTime;
                    
                    const videoDuration = videoDurations[state.data.firstChoice];
                    if (videoDuration) {
                        state.data.videoWatchPercentage = Math.min(100, Math.round((watchTime / videoDuration) * 100));
                    }
                }
                await runNode(node.next);
            } else {
                await printText(["Proszę potwierdzić obejrzenie projekcji, aby kontynuować."]);
            }
            return;
        }
        
        if (node.type === 'input') {
            if (node.varName) state.data[node.varName] = val;
            await runNode(node.next);
            
            setTimeout(() => {
                const surveyFrame = document.querySelector('.survey-frame');
                if (surveyFrame) {
                    surveyFrame.scrollTop = surveyFrame.scrollHeight;
                }
                dom.input.focus();
            }, 100);
            
            return;
        }

        if (node.type === 'input_age') {
            const age = parseInt(val, 10);
            if (!isNaN(age) && age >= 3 && age <= 99) {
                state.data[node.varName] = age;
                await runNode(node.next);
            } else {
                await printText(["Proszę podać wiek jako liczbę w zakresie od 3 do 99."]);
            }
            return;
        }

        if (node.type.startsWith('survey')) {
            if (node.type === 'survey_likert') {
                const number = parseInt(val, 10);
                if (isNaN(number) || number < 1 || number > 5) {
                    const surveyFrame = document.querySelector('.survey-frame');
                    await printText(["Proszę podać odpowiedź jako cyfrę w zakresie od 1 do 5."], 10, surveyFrame);
                    setTimeout(() => {
                        if (surveyFrame) surveyFrame.scrollTop = surveyFrame.scrollHeight;
                    }, 50);
                    return;
                }
            }

            clearInterval(window.surveyInterval);
            dom.timer.style.display = 'none';
            state.data.survey[state.node] = val;

            const nextNode = gameData[node.next];
            if (nextNode && !nextNode.type.startsWith('survey')) {
                const surveyFrame = document.querySelector('.survey-frame');
                if (surveyFrame) {
                    const surveyContent = surveyFrame.innerHTML;
                    surveyFrame.remove();
                    dom.narrative.innerHTML += '<div class="history-text survey-history">' + surveyContent + '</div>';
                }
                document.body.classList.remove('survey-mode');
            }
            
            await runNode(node.next);
            
            setTimeout(() => {
                const surveyFrame = document.querySelector('.survey-frame');
                if (surveyFrame) {
                    surveyFrame.scrollTop = surveyFrame.scrollHeight;
                }
                dom.input.focus();
            }, 100);
            
            return;
        }

        if (node.keywords) {
            for (let key in node.keywords) {
                if (lower.includes(key)) {
                    if ((key === 'dokumenty' || key === 'przegladam' || key === 'rozkladam' || key === 'pozostale' || key === 'przejrz') && !state.data.viewedFullDocs) {
                        state.data.viewedFullDocs = true;
                        state.data.docsOpenTime = Date.now();
                    }
                    await runNode(node.keywords[key]);
                    return;
                }
            }
        }

        state.errors++;
        let msg = "";
        if (state.errors === 1) msg = "Spróbuj inaczej sformułować swoją intencję.";
        else if (state.errors === 2) msg = "System nie rozumie.";
        else msg = "Wpisz komendę.";
        
        const surveyFrame = document.querySelector('.survey-frame');
        if (surveyFrame && document.body.classList.contains('survey-mode')) {
            await printText([msg], 10, surveyFrame);
            setTimeout(() => {
                if (surveyFrame) surveyFrame.scrollTop = surveyFrame.scrollHeight;
            }, 50);
        } else {
            await printText([msg]);
        }
    } catch (error) {
        console.error('Error in handleInput:', error);
    }
}

    const a = document.createElement('a');
    a.href = url;
    a.download = 'wynik_' + (state.data.userName || 'badany') + '.json';
    document.body.appendChild(a);
    a.click();
    
    printText([
        "",
        "--- SYSTEM RAPORT ---",
        "Plik zapisany lokalnie.",
        "Backup code (skopiuj jeśli plik się nie zapisał):",
        b64
    ]);
}

window.onload = () => {
    try {
        console.log('Window loaded, initializing...');
        dom.displayText = document.getElementById('display-text');
        
        if (!dom.displayText) {
            console.error('display-text not found!');
        }
        
        dom.input.addEventListener('input', (e) => {
            if (dom.displayText) {
                dom.displayText.textContent = dom.input.value.toUpperCase();
            }
        });
        
        dom.input.focus();
        document.addEventListener('click', () => {
            dom.input.focus();
        });
        
        console.log('Starting game...');
        setTimeout(async () => {
            await runNode('boot_name');
        }, 200);
    } catch (error) {
        console.error('Error in window.onload:', error);
    }
};
</script>
</body>
